# Workflow to automatically run tests on push or pull request.
name: Python CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        # We explicitly add requests and tabulate here to be 100% safe
        pip install requests tabulate pytest pytest-mock

    - name: Run tests with pytest
      # PYTHONPATH so pytest can "see" the src folder
      run: |
        export PYTHONPATH=$PYTHONPATH:$(pwd)
        pytest
